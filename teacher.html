<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会小导 · 教师看板</title>
<style>
:root{
  --ink:#1f2328; --ink2:#57606a; --ink3:#8b949e;
  --line:#e6e8eb; --bg:#f7f8fa; --card:#ffffff;
  --brand:#2f6bd8; --brand-d:#2455ad;
  --ok:#1aa15a; --warn:#e8a300; --bad:#d64545;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
a{color:var(--brand)}

/* ---------- 登录 ---------- */
#login{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-box{
  width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:34px 30px; box-shadow:0 2px 14px rgba(20,30,50,.06);
}
.login-box h1{ margin:0 0 6px; font-size:21px; }
.login-box p.sub{ margin:0 0 22px; color:var(--ink3); font-size:13px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; color:var(--ink2); margin-bottom:6px; }
.field input{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  font-size:14px; background:#fff; color:var(--ink);
}
.field input:focus{ outline:none; border-color:var(--brand); }
.btn{
  width:100%; padding:11px; border:0; border-radius:8px; background:var(--brand);
  color:#fff; font-size:15px; cursor:pointer;
}
.btn:hover{ background:var(--brand-d); }
.btn:disabled{ background:#9db4e0; cursor:not-allowed; }
.msg{ margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13px; display:none; }
.msg.err{ display:block; background:#fdecec; color:var(--bad); }
.msg.ok{ display:block; background:#eaf7ef; color:var(--ok); }
.hint{ margin-top:18px; font-size:12px; color:var(--ink3); line-height:1.7; }

/* ---------- 主区 ---------- */
#app{ display:none; }
.topbar{
  background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:10;
}
.topbar h1{ margin:0; font-size:17px; }
.topbar .sp{ flex:1; }
.tag{
  font-size:12px; padding:4px 10px; border-radius:20px;
  background:#eef2f8; color:var(--ink2);
}
.tag b{ color:var(--brand); }
.tbtn{
  padding:7px 14px; border:1px solid var(--line); border-radius:7px;
  background:#fff; color:var(--ink2); font-size:13px; cursor:pointer;
}
.tbtn:hover{ border-color:var(--brand); color:var(--brand); }
.tbtn.main{ background:var(--brand); color:#fff; border-color:var(--brand); }
.tbtn.main:hover{ background:var(--brand-d); }

.wrap{ max-width:1240px; margin:0 auto; padding:22px 24px 60px; }

/* ---------- 概览卡 ---------- */
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:14px; margin-bottom:22px; }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
}
.card .k{ font-size:12px; color:var(--ink3); margin-bottom:6px; }
.card .v{ font-size:27px; font-weight:600; line-height:1.15; }
.card .u{ font-size:13px; color:var(--ink3); font-weight:400; margin-left:3px; }

.sec-title{
  font-size:15px; font-weight:600; margin:26px 0 12px;
  display:flex; align-items:center; gap:8px;
}
.sec-title small{ font-weight:400; font-size:12px; color:var(--ink3); }

/* ---------- 分数段 ---------- */
.bands{ display:flex; gap:10px; align-items:flex-end; height:170px; padding:0 4px; }
.band{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; }
.band .n{ font-size:14px; font-weight:600; }
.band .bar{ width:100%; background:var(--brand); border-radius:5px 5px 0 0; min-height:3px; }
.band .lb{ font-size:12px; color:var(--ink2); text-align:center; }

/* ---------- 四维 ---------- */
.dims{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
.dim{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 17px; }
.dim .t{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.dim .t span{ font-size:13px; color:var(--ink2); }
.dim .t b{ font-size:20px; }
.track{ height:8px; background:#eef0f3; border-radius:5px; overflow:hidden; }
.track i{ display:block; height:100%; background:var(--brand); border-radius:5px; }
.dim .tip{ font-size:11px; color:var(--ink3); margin-top:8px; }

/* ---------- 名单 ---------- */
.table-wrap{ background:var(--card); border:1px solid var(--line); border-radius:11px; overflow:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ background:#fafbfc; color:var(--ink2); font-weight:600; font-size:12px; position:sticky; top:0; }
tr:last-child td{ border-bottom:0; }
tr:hover td{ background:#f9fafb; }
td.rate{ font-weight:600; }
.pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; }
.pill.g{ background:#eaf7ef; color:#14804a; }
.pill.m{ background:#fdf6e3; color:#9a7b00; }
.pill.b{ background:#fdecec; color:#b83b3b; }

.empty{ padding:44px 20px; text-align:center; color:var(--ink3); }
.empty b{ display:block; color:var(--ink2); font-size:15px; margin-bottom:7px; }

@media(max-width:640px){
  .wrap{ padding:16px 14px 40px; }
  .bands{ height:140px; }
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-box">
    <h1>会小导 · 教师看板</h1>
    <p class="sub">学情分析与成绩导出</p>
    <div class="field">
      <label for="key">教师口令</label>
      <input type="password" id="key" placeholder="请输入教师口令" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="api">后端地址</label>
      <input type="text" id="api" placeholder="留空=使用默认地址">
    </div>
    <button class="btn" id="login-btn">进入看板</button>
    <div class="msg" id="login-msg"></div>
    <div class="hint">
      看板只读取<b>成绩汇总数据</b>（学号、答对题数、四维得分、提交日期），<br>
      不含个人作答明细、AI 提问内容与浏览记录。<br>
      <a href="index.html">← 返回学生端</a>
    </div>
  </div>
</div>

<!-- 看板 -->
<div id="app">
  <div class="topbar">
    <h1>会小导 · 教师看板</h1>
    <span class="tag">后端 <b id="tag-api">—</b></span>
    <span class="tag" id="tag-db">—</span>
    <div class="sp"></div>
    <button class="tbtn" id="refresh-btn">刷新</button>
    <button class="tbtn main" id="csv-btn">导出 CSV</button>
    <button class="tbtn main" id="csv-survey-btn">导出问卷</button>
    <button class="tbtn" id="logout-btn">退出</button>
  </div>

  <div class="wrap">
    <div class="cards" id="cards"></div>

    <div class="sec-title">分数段分布 <small>按每位学生最新一次考核的正确率</small></div>
    <div class="card" style="padding:20px">
      <div class="bands" id="bands"></div>
    </div>

    <div class="sec-title">四维整体均分 <small>知识 / 能力 / 素养 / 规划，满分 100</small></div>
    <div class="dims" id="dims"></div>

    <div class="sec-title">学生名单 <small id="stu-count"></small></div>
    <div class="table-wrap">
      <table id="stu-table">
        <thead><tr>
          <th>学号</th><th>姓名</th><th>答对</th><th>正确率</th>
          <th>知识</th><th>能力</th><th>素养</th><th>规划</th><th>错题</th><th>日期</th>
        </tr></thead>
        <tbody id="stu-body"></tbody>
      </table>
      <div class="empty" id="stu-empty" style="display:none">
        <b>还没有学生提交考核</b>
        学生完成一次考核后，成绩会自动出现在这里
      </div>
    </div>

    <div class="sec-title" id="trend-title">历次考核趋势</div>
    <div class="table-wrap">
      <table id="trend-table">
        <thead><tr><th>日期</th><th>交卷人数</th><th>平均正确率</th><th>知识</th><th>能力</th><th>素养</th><th>规划</th></tr></thead>
        <tbody id="trend-body"></tbody>
      </table>
      <div class="empty" id="trend-empty" style="display:none"><b>暂无趋势数据</b></div>
    </div>
  </div>
</div>

<script>
/* 后端地址解析：与学生端一致
   1) ?api= 参数  2) localStor
